name: Release

# Publishes to npm when a GitHub release is published. Authenticates with npm
# trusted publishing (OIDC), so no npm token is stored in the repo. npm adds a
# provenance attestation automatically, but only while the repo is public.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$expected" ]; then
            echo "Release tag $TAG does not match package.json ($expected)" >&2
            exit 1
          fi
      # prepublishOnly runs typecheck, tests, build and the tarball check.
      - run: npm publish --access public
      # JSR authenticates with the same OIDC token; link the package to this
      # repository in its jsr.io settings first.
      - run: npx jsr publish
